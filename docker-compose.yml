version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sanskrit_postgres
    environment:
      POSTGRES_DB: sanskrit_ir
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: sanskrit_opensearch
    environment:
      - cluster.name=sanskrit-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m font"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sanskrit_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/sanskrit_ir
      - ELASTICSEARCH_URL=http://opensearch:9200
      - SECRET_KEY=sanskrit_ir_production_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sanskrit_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  opensearch_data:
